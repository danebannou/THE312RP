<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE312RP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="header"></header>

<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <main>
    <section class="welcome">
      <p class="kicker">Bienvenue</p>
      <h1 id="welcomeTitle"></h1>
      <p class="muted">Choisis une catégorie dans le menu pour voir son contenu.</p>
      <div id="welcomeBtn"></div>
    </section>
  </main>
</div>

<footer id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async () => {
  const s = await getSettings();
  renderHeader(s);
  renderSidebar(null);
  document.getElementById("welcomeTitle").textContent = s.site_name || "THE312RP";
  if (s.discord_url)
    document.getElementById("welcomeBtn").innerHTML =
      `<a class="btn discord big" href="${esc(s.discord_url)}" target="_blank" rel="noopener">Rejoindre le Discord</a>`;
  document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${s.site_name || "THE312RP"}`;
})();
</script>
</body>
</html>
