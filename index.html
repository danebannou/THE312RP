<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE312RP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="header"></header>

<section id="banner" class="banner"></section>

<main>
  <h2 class="section-title">Catégories</h2>
  <div id="cats" class="cats"></div>
</main>

<footer id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async () => {
  const s = await getSettings();
  renderHeader(s);

  document.getElementById("banner").innerHTML = `
    ${s.banner_url ? `<img src="${esc(s.banner_url)}" alt="">` : ""}
    <div class="banner-text">
      <h1>${esc(s.site_name || "THE312RP")}</h1>
      ${s.discord_url ? `<a class="btn discord big" href="${esc(s.discord_url)}" target="_blank" rel="noopener">Rejoindre le Discord</a>` : ""}
    </div>`;

  const [{ data: cats }, { data: items }] = await Promise.all([
    db.from("categories").select("*").order("position").order("created_at"),
    db.from("items").select("category_id,image_url,created_at").order("created_at", { ascending: false }),
  ]);

  const box = document.getElementById("cats");
  if (!cats || !cats.length) { box.innerHTML = '<p class="empty">Aucune catégorie pour le moment.</p>'; }
  else box.innerHTML = cats.map((c) => {
    const mine = (items || []).filter((i) => i.category_id === c.id);
    const cover = mine.find((i) => i.image_url);
    return `<a class="cat-card" href="category.html?id=${c.id}">
      ${cover ? `<img src="${esc(cover.image_url)}" alt="" loading="lazy">` : ""}
      <div class="cat-label"><span>${esc(c.name)}</span><small>${mine.length} élément${mine.length > 1 ? "s" : ""}</small></div>
    </a>`;
  }).join("");

  document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${s.site_name || "THE312RP"}`;
})();
</script>
</body>
</html>
