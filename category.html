<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE312RP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="header"></header>

<main>
  <a class="back" href="index.html">← Retour</a>
  <h2 id="title" class="section-title"></h2>
  <div id="items" class="items big"></div>
</main>

<footer id="footer"></footer>

<!-- Fenêtre d'affichage des photos -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" id="mClose" aria-label="Fermer">✕</button>
    <div class="viewer">
      <button class="nav prev" id="mPrev" aria-label="Précédente">‹</button>
      <img id="mImg" alt="">
      <button class="nav next" id="mNext" aria-label="Suivante">›</button>
    </div>
    <div id="mThumbs" class="mthumbs"></div>
    <div class="modal-info">
      <h3 id="mTitle"></h3>
      <p id="mDesc"></p>
      <div id="mStatus"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  const s = await getSettings();
  renderHeader(s);

  const [{ data: cat }, { data: items }] = await Promise.all([
    db.from("categories").select("*").eq("id", id).single(),
    db.from("items").select("*").eq("category_id", id).order("created_at", { ascending: false }),
  ]);

  document.getElementById("title").textContent = cat ? cat.name : "Catégorie introuvable";

  const status = (i) => i.available
    ? (s.discord_url
        ? `<a class="btn green" href="${esc(s.discord_url)}" target="_blank" rel="noopener">Disponible</a>`
        : `<span class="btn green">Disponible</span>`)
    : `<span class="btn red">Indisponible</span>`;

  const list = items || [];
  const box = document.getElementById("items");
  if (!list.length) box.innerHTML = '<p class="empty">Rien ici pour le moment.</p>';
  else box.innerHTML = list.map((i, n) => {
    const p = imgs(i);
    return `<article class="item ${i.available ? "" : "off"}">
      <div class="img clickable" data-open="${n}">
        <div class="track">
          ${p.map((u) => `<img src="${esc(u)}" alt="${esc(i.title)}" loading="lazy">`).join("")}
        </div>
        ${p.length > 1 ? `<button class="cnav cprev" data-slide="-1" aria-label="Précédente">‹</button>
        <button class="cnav cnext" data-slide="1" aria-label="Suivante">›</button>
        <span class="count">1 / ${p.length}</span>` : ""}
      </div>
      <div class="body">
        <h3>${esc(i.title)}</h3>
        <p>${esc(i.description)}</p>
        ${status(i)}
      </div>
    </article>`;
  }).join("");

  // --- Galerie ---
  const $ = (x) => document.getElementById(x);
  let cur = null, idx = 0;
  function show() {
    const p = imgs(cur);
    $("mImg").src = p[idx] || "";
    $("mPrev").hidden = $("mNext").hidden = p.length < 2;
    $("mThumbs").innerHTML = p.length < 2 ? "" :
      p.map((u, k) => `<img src="${esc(u)}" class="${k === idx ? "on" : ""}" data-k="${k}" alt="">`).join("");
  }
  function openItem(n, start = 0) {
    cur = list[n]; idx = start;
    $("mTitle").textContent = cur.title;
    $("mDesc").textContent = cur.description || "";
    $("mStatus").innerHTML = status(cur);
    show();
    $("modal").hidden = false;
    document.body.style.overflow = "hidden";
  }
  function close() { $("modal").hidden = true; document.body.style.overflow = ""; }
  const move = (d) => { const l = imgs(cur).length; idx = (idx + d + l) % l; show(); };

  const slideIndex = (el) => {
    const t = el.querySelector(".track");
    return Math.round(t.scrollLeft / t.clientWidth) || 0;
  };
  box.addEventListener("click", (e) => {
    const el = e.target.closest("[data-open]");
    if (!el) return;
    const arrow = e.target.closest("[data-slide]");
    const t = el.querySelector(".track");
    if (arrow) {
      t.scrollBy({ left: +arrow.dataset.slide * t.clientWidth, behavior: "smooth" });
      return;
    }
    openItem(+el.dataset.open, slideIndex(el));
  });
  // Met à jour le compteur « 2 / 5 » quand on fait glisser les photos
  box.addEventListener("scroll", (e) => {
    const t = e.target;
    if (!t.classList || !t.classList.contains("track")) return;
    const c = t.parentElement.querySelector(".count");
    if (c) c.textContent = `${Math.round(t.scrollLeft / t.clientWidth) + 1} / ${t.children.length}`;
  }, true);

  // Glisser du doigt dans la galerie
  let x0 = null;
  $("mImg").addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  $("mImg").addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40 && imgs(cur).length > 1) move(dx < 0 ? 1 : -1);
    x0 = null;
  });
  $("mClose").onclick = close;
  $("mPrev").onclick = () => move(-1);
  $("mNext").onclick = () => move(1);
  $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) close(); });
  $("mThumbs").addEventListener("click", (e) => { if (e.target.dataset.k) { idx = +e.target.dataset.k; show(); } });
  document.addEventListener("keydown", (e) => {
    if ($("modal").hidden) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") move(-1);
    if (e.key === "ArrowRight") move(1);
  });

  document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${s.site_name || "THE312RP"}`;
})();
</script>
</body>
</html>
